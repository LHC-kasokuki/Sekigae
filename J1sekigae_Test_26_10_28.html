                for(let i = 0;i<41;i++)
                {
                    c.push(0);
                }
            
                for(let i = 0;i<gyou;i++)
                {
                    for(let j = 0;j<line;j++)
                    {
                        getElement[i][j] = document.getElementById(`c${i}-${j}`);
                        if(i==0||i==gyou-1)
                        {
                            if(j == finalline-1)
                                break;

                    }

                Num.length = 0;

            button.addEventListener('click',async function()

                if(!Teacher)

                    alert("貴様は先生ではなかろうに");  
                }
                else
                {
                    //for(let i = 0; i < shufflenum; i++)

                    // irenai.push(HanasuNum[0]);
                    // irenai.push(HanasuNum[1]);

                    //初期化
                    initialize();
                    distance = 0;
                    Nankaime = 0;

                    //先に前の席に座る人のランダムな配置をするので、ランダムに決まる席の場所を保存しておく。後のループ処理で使う。
                    //1つ目:出席番号　2つ目:席の番号
                    //let FrontCAd = Array.from({ length: FNum.length }, () => Array(2).fill(0));
                    for(let i = 0;i<FNum.length;i++)
                    {
                        Fnump=Math.floor(Math.random()*6);
                        Fnumpkeep[i]=Fnump;
                        while(Fnumpkeep.includes(Fnump))
                        {
                            Fnump=Math.floor(Math.random()*6);
                            Fnumpkeep[i]=Fnump;
                        }
                        //FrontCAd[i][0]=FNum[i];
                    }

                    let forFNumj=0;
                    for(let i = 0;i<gyou;i++)
                    {                    
                        if(i==0)

                            {
                                if(j==Fnumpkeep[forFNumj])
                                {
                                    c[i+j]=FNum[Fnumpkeep];
                                    getElement[i][j].textContent = c[i+j];
                                    await sleep(100);
                                    forFNumj++;
                                }

                                }
                            }

                    while(irenai.includes(c00))

                        spliceNum = Math.floor( Math.random() * (FinalNumber -Nankaime));
                        console.log(spliceNum);
                        c00 = Num[spliceNum];

                    console.log(Num); 
                    document.getElementById("c0-0").textContent = c00;
                    irenai.push(c00);
                    distance += 15;
                    Nankaime++;

                    var resultForm = document.getElementById("resultForm");

                    resultForm.value = shufflenum;

                        console.log(Num);
                    }
